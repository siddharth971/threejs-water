<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Babylon.js WebGPU FFT Ocean & Particle Simulation</title>
    <meta
      name="description"
      content="High-fidelity ocean simulation powered by Babylon.js and WebGPU compute shaders with JONSWAP spectrum FFT wave synthesis and particle system."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Babylon.js Global CDN scripts for WebGPU, Materials, GUI, and Loaders -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/materialsLibrary/babylonjs.materials.min.js"></script>
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.6.2/dat.gui.min.js"></script>
  </head>
  <body>
    <!-- Top-Left Floating Title Badge -->
    <div id="badge-bar">
      <div id="app-badge">
        <div class="status-dot"></div>
        <span class="badge-title">BABYLON.JS OCEAN</span>
        <span class="badge-tag">WebGPU FFT Waves + Particles</span>
      </div>
      <div id="controls-hint">
        <span>Press <strong>F8</strong> to toggle GUI · <strong>WASD / Arrow Keys</strong> to move camera · <strong>Shift</strong> to accelerate</span>
      </div>
    </div>

    <!-- Main Babylon.js WebGPU Render Canvas -->
    <canvas id="renderCanvas"></canvas>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
